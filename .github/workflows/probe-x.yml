name: Probe X activity (einmalig)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import re, urllib.request
          UA={"User-Agent":"TF-Schedule listener tool (github.com/TF-Schedule/dj-claude-schedule)"}
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode("utf-8","replace")
              except Exception as e:
                  return f"ERR {e}"
          main = get("https://andonlabs.com/radio")
          open("radio_len.txt","w").write(str(len(main)))
          links = sorted(set(re.findall(r'["\'](/radio/[^"\'?#\s]+)', main)))
          apis = sorted(set(re.findall(r'["\'](https?://[^"\']*(?:api|tweet|twitter|x\.com)[^"\']*)["\']', main)))
          open("links.txt","w").write("\n".join(links+["---"]+apis))
          pages = {"radio": main}
          for l in links[:8]:
              pages[l.strip("/").replace("/","_")] = get("https://andonlabs.com"+l)
          with open("hits.txt","w") as f:
              for name, h in pages.items():
                  f.write(f"===== {name} ({len(h)} Zeichen)\n")
                  for kw in ["tweet","Tweet","twitter","activity","Activity","replyTo","inReplyTo","andon_thinking","arrlysa","postedAt","createdAt","isHost"]:
                      for m in list(re.finditer(kw, h))[:3]:
                          f.write(f"--- {kw} @ {m.start()}\n{h[max(0,m.start()-300):m.start()+700]}\n")
          PY
      - name: Save
        run: |
          cd out
          git init -q -b probe-x && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Probe X activity"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-x
